# Root compose (owner: M4 Ziad). Only include: lines + shared infra. Each owner edits their own services/<x>/compose.yaml.
include:
  - services/api/compose.yaml
  - services/agent/compose.yaml
  - services/gateway/compose.yaml
  - services/risk/compose.yaml
  - services/extractor/compose.yaml
  - frontend/compose.yaml

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-securefin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securefin}
      POSTGRES_DB: ${POSTGRES_DB:-securefin}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  # Optional automation (n8n/README.md). Start with: docker compose --profile n8n up -d n8n
  # n8n only notifies and reports. It gets no database URL and no approval key: it calls service APIs with its own
  # tokens, and every variable it may read is listed here on purpose (no env_file).
  n8n:
    image: n8nio/n8n:2.46.7  # pinned; bump on purpose after reading the release notes
    profiles: [n8n]
    entrypoint:
      - /bin/sh
      - -c
      - '[ -n "$$N8N_ENCRYPTION_KEY" ] || { echo "Set N8N_ENCRYPTION_KEY in .env (openssl rand -hex 32)" >&2; exit 1; }; exec tini -- /docker-entrypoint.sh'
    ports: ["127.0.0.1:5678:5678"]  # editor on this machine only; services reach it as http://n8n:5678
    environment:
      # Saved credentials are encrypted with this key. Without a fixed key a rebuilt container cannot read them.
      # The entrypoint below refuses to start without it (a ${VAR:?} check here would break compose for everyone
      # who does not run n8n).
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      GENERIC_TIMEZONE: Africa/Cairo  # the nightly run is at 02:00 Cairo time
      TZ: Africa/Cairo
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"  # the workflows read the variables below
      # No shell, no local files and no Postgres node: n8n must go through the service APIs.
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.ssh","n8n-nodes-base.localFileTrigger","n8n-nodes-base.readWriteFile","n8n-nodes-base.postgres"]'
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"  # hours; execution logs can hold invoice files
      # Standalone until the services exist: an empty URL makes that workflow run on its own (n8n/README.md).
      # 1 invoice email intake
      N8N_INVOICE_UPLOAD_URL: ${N8N_INVOICE_UPLOAD_URL:-}
      N8N_INTAKE_TOKEN: ${N8N_INTAKE_TOKEN:-}
      N8N_COMPANY_ID: ${N8N_COMPANY_ID:-1}
      # 2 decision notifications
      N8N_WEBHOOK_HMAC_SECRET: ${N8N_WEBHOOK_HMAC_SECRET:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      # 3 nightly integrity run
      N8N_AUDIT_VERIFY_URL: ${N8N_AUDIT_VERIFY_URL:-}
      N8N_GATEWAY_TOKEN: ${AUDIT_VERIFY_TOKEN:-}
      N8N_AUDIT_COMPANY_IDS: ${N8N_AUDIT_COMPANY_IDS:-1}
      N8N_ATTACK_RUN_URL: ${N8N_ATTACK_RUN_URL:-}
      N8N_EVAL_TOKEN: ${N8N_EVAL_TOKEN:-}
      N8N_ATTACK_MIN_CASES: ${N8N_ATTACK_MIN_CASES:-22}
      N8N_HEARTBEAT_URL: ${N8N_HEARTBEAT_URL:-}
    volumes:
      - n8n_data:/home/node/.n8n  # credentials, published workflows, seen event ids, last-OK time
      - ./n8n/workflows:/workflows:ro

volumes:
  pgdata:
  n8n_data:
