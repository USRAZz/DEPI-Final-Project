# Service owner: M4 (Ziad). Container setup: M4 (Ziad). Only this file defines the 'risk' container.
services:
  risk:
    build:
      context: ../..
      dockerfile: services/risk/Dockerfile
    env_file: ../../.env
    healthcheck:  # GET /health inside the container (no curl in python:slim); docker compose ps shows it
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "8003:8000"
