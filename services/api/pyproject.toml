# Used by Vercel (Root Directory: services/api). Docker and CI still install requirements.txt;
# keep the two dependency lists in step.
[project]
name = "securefin-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "securefin-contracts",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.9",
]

[tool.uv]
package = false

[tool.uv.sources]
# The shared contracts at the repository root. On Vercel this needs "Include files outside
# the root directory in the Build Step" (Project Settings > General > Root Directory).
securefin-contracts = { path = "../../contracts" }

[tool.vercel]
entrypoint = "app.main:app"
