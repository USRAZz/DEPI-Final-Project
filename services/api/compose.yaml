# Service owner: M1 (Karim). Container setup: M4 (Ziad). Only this file defines the 'api' container.
services:
  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    env_file: ../../.env
    healthcheck:  # GET /health inside the container (no curl in python:slim); docker compose ps shows it
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "8000:8000"
    depends_on:  # start only when they answer /health
      postgres: { condition: service_healthy }
      agent: { condition: service_healthy }
      gateway: { condition: service_healthy }
      extractor: { condition: service_healthy }
