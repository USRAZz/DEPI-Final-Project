[project]
name = "securefin-contracts"
version = "0.1.0"
description = "Shared Pydantic models between SecureFin AI services. Change via a 'contract-change' PR only."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["securefin_contracts"]
