# Container images for staging and production (owner: M4 Ziad). ops/deploy/README.md explains the flow.
#   push to dev      -> ghcr.io/<owner>/securefin-<service>:staging and :sha-<7 chars>
#   tag v1.2.3       -> ghcr.io/<owner>/securefin-<service>:v1.2.3   (production deploys pin this)
#   pull request     -> build only, nothing is pushed
# Servers never build: they pull exactly what CI built and tested.
name: Images
on:
  push:
    branches: [dev]
    tags: ["v*.*.*"]
  pull_request:
    paths: ["services/**", "contracts/**", "ai_core/**", "prompts/**", "policies/**", ".github/workflows/images.yml"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, agent, gateway, risk, extractor]
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/securefin-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern=v{{version}}
          labels: org.opencontainers.image.title=securefin-${{ matrix.service }}
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
